{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card rounded-card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4"><i class="fa-solid fa-key me-2 text-warning"></i>修改密碼</h4>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold">目前密碼</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">新密碼</label>
            <input type="password" name="new_password" class="form-control" required minlength="4">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">確認新密碼</label>
            <input type="password" name="confirm_password" class="form-control" required minlength="4">
          </div>
          <button type="submit" class="btn btn-warning fw-bold w-100">確認修改</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
