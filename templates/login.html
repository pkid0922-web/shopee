<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 | e橙購物進銷存</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, #ff9f43 0%, #ff6b6b 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); width: 100%; max-width: 400px; padding: 40px; border: none; }
        .form-control { border-radius: 12px; padding: 12px; border: 1px solid #eee; margin-bottom: 20px; }
        .btn-login { background: #ff9f43; color: white; border: none; border-radius: 12px; padding: 12px; font-weight: 700; width: 100%; transition: 0.3s; }
        .btn-login:hover { background: #ff8c21; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="fw-bold mb-2 text-dark">🍊 e橙購物</h2>
        <p class="text-muted small mb-4">雲端進銷存管理系統 V3.0</p>
        
        <form method="POST">
            <input type="text" name="username" class="form-control" placeholder="使用者帳號" required autofocus>
            <input type="password" name="password" class="form-control" placeholder="登入密碼" required>
            <button class="btn-login" type="submit">立即登入</button>
        </form>
        
        <div class="mt-4"><small class="text-muted">忘記密碼請聯絡系統管理員 admin</small></div>
    </div>
</body>
</html>
