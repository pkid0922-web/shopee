{% extends "layout.html" %}
{% block content %}
<div class="mb-4">
    <h3 class="fw-bold text-success"><i class="fa-solid fa-truck-ramp-box me-2"></i>開立進貨單 <span class="badge bg-danger ms-2 fs-6">連續快打模式</span></h3>
    <p class="text-muted small">提示：掃碼後按 Enter 自動跳格。在條碼框按 <kbd>F4</kbd> 可刪除該行，或直接重刷條碼以覆蓋商品。</p>
</div>

<style>
    .vendor-search-results { position: absolute; z-index: 1050; width: 100%; top: 100%; left: 0; background: white; border: 1px solid #198754; border-radius: 0 0 10px 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: none; max-height: 250px; overflow-y: auto; }
    .vendor-search-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f8f9fa; transition: 0.2s; }
    .vendor-search-item:hover { background: #e8f5e9; }
    .vendor-search-item.active { background: #198754; color: white; }
    #searchOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; outline: none; }
    .search-modal { background: white; width: 85%; max-width: 1100px; max-height: 80vh; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    .search-body { flex: 1; overflow-y: auto; padding: 10px; }
    .search-row { cursor: pointer; border-bottom: 1px solid #eee; }
    .search-row.active td { background-color: #198754 !important; color: white !important; }
    /* 網格輸入框美化 */
    .grid-input { border: 1px solid transparent; background-color: transparent; transition: 0.2s; }
    .grid-input:focus { border: 2px solid #198754; background-color: #fff; outline: none; box-shadow: 0 0 5px rgba(25,135,84,0.3); }
    .grid-readonly { background-color: #f8f9fa !important; color: #6c757d; border: 1px solid #dee2e6; }
</style>

<form action="/finalize_purchase" method="POST" id="purchaseForm">
    <div class="card rounded-card border-0 shadow-sm p-4 mb-4 bg-white border-start border-5 border-success">
        <div class="row g-4">
            <div class="col-md-5 position-relative">
                <label class="small fw-bold text-success">1. 進貨廠商 (搜尋編號/簡稱)</label>
                <input type="text" id="vendorSearch" class="form-control form-control-lg border-success shadow-sm" placeholder="🔍 搜尋廠商..." autocomplete="off" required>
                <input type="hidden" name="vendor_id" id="hiddenVendorId">
                <div id="vendorDropdown" class="vendor-search-results text-dark"></div>
            </div>
            <div class="col-md-4">
                <label class="small fw-bold">進貨單據日期</label>
                <input type="date" name="date" class="form-control form-control-lg shadow-sm" value="{{ today }}" required>
            </div>
            <div class="col-md-3">
                <label class="small fw-bold text-success">歸屬月帳</label>
                <input type="number" name="billing_month" class="form-control form-control-lg shadow-sm border-success" value="{{ month }}" required>
            </div>
        </div>
    </div>

    <div class="card rounded-card border-0 shadow-sm bg-white overflow-hidden mb-4">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-success small">
                <tr>
                    <th width="20%" class="ps-3 py-3">2. 國際條碼 (掃碼/自編)</th>
                    <th width="30%" class="py-3">商品名稱</th>
                    <th width="15%" class="py-3 text-center">3. 進貨數量</th>
                    <th width="15%" class="py-3 text-end">4. 採購單價</th>
                    <th width="15%" class="py-3">5. 備註 (Enter新增行)</th>
                    <th width="5%" class="py-3 text-center">操作</th>
                </tr>
            </thead>
            <tbody id="itemList">
                </tbody>
        </table>
    </div>
    
    <div class="text-end mt-4">
        <button type="submit" class="btn btn-success px-5 py-3 rounded-pill fw-bold shadow fs-5"><i class="fa-solid fa-check-double me-2"></i>確認送出進貨單</button>
    </div>
</form>

<div id="searchOverlay" tabindex="-1">
    <div class="search-modal">
        <div class="search-body">
            <table class="table align-middle"><thead class="sticky-top bg-white"><tr class="text-muted small"><th>商品名稱</th><th>國際條碼</th><th>自編碼</th></tr></thead><tbody id="resList"></tbody></table>
        </div>
    </div>
</div>

<script>
// === 廠商搜尋邏輯 ===
const vendorData = [ {% for v in vendors %} { id: "{{ v.id }}", no: "{{ v.vendor_no }}", name: "{{ v.short_name }}" }, {% endfor %} ];
const vendorSearch = document.getElementById('vendorSearch'), vendorDropdown = document.getElementById('vendorDropdown'), hiddenVendorId = document.getElementById('hiddenVendorId');
let filteredVendors = [], vendorActiveIdx = -1;

vendorSearch.addEventListener('input', function() {
    const q = this.value.toLowerCase().trim(); hiddenVendorId.value = ''; 
    if (!q) { filteredVendors = vendorData; } else { filteredVendors = vendorData.filter(v => v.no.toLowerCase().includes(q) || v.name.toLowerCase().includes(q)); }
    showVendorDropdown();
});
function showVendorDropdown() {
    if (filteredVendors.length === 0) { vendorDropdown.innerHTML = '<div class="p-3 text-muted small text-center">找不到相符的廠商</div>'; } 
    else { vendorDropdown.innerHTML = filteredVendors.map((v, i) => `<div class="vendor-search-item" onclick="selectVendor(${i})" id="vendor-row-${i}"><span class="fw-bold">${v.no}</span> - <span>${v.name}</span></div>`).join(''); }
    vendorDropdown.style.display = 'block'; vendorActiveIdx = -1;
}
function selectVendor(idx) {
    const v = filteredVendors[idx]; vendorSearch.value = `${v.no} - ${v.name}`; hiddenVendorId.value = v.id;
    vendorDropdown.style.display = 'none'; 
    const firstBarcode = document.querySelector('.barcode-input');
    if(firstBarcode) firstBarcode.focus();
}
vendorSearch.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); vendorActiveIdx = Math.min(vendorActiveIdx + 1, filteredVendors.length - 1); updateVendorActive(); } 
    else if (e.key === 'ArrowUp') { e.preventDefault(); vendorActiveIdx = Math.max(vendorActiveIdx - 1, 0); updateVendorActive(); } 
    else if (e.key === 'Enter') { e.preventDefault(); if (vendorActiveIdx > -1 && filteredVendors.length > 0) selectVendor(vendorActiveIdx); else if (filteredVendors.length === 1) selectVendor(0); } 
    else if (e.key === 'Escape') { vendorDropdown.style.display = 'none'; }
});
function updateVendorActive() { document.querySelectorAll('.vendor-search-item').forEach((el, i) => { el.classList.toggle('active', i === vendorActiveIdx); if (i === vendorActiveIdx) el.scrollIntoView({ block: 'nearest' }); }); }
document.addEventListener('click', e => { if (!vendorSearch.contains(e.target) && !vendorDropdown.contains(e.target)) vendorDropdown.style.display = 'none'; });

// === 連續網格快打邏輯 ===
const itemList = document.getElementById('itemList');
let activeTr = null; 
let sList = [], aIdx = -1;
const overlay = document.getElementById('searchOverlay'), resList = document.getElementById('resList');

function createRow() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="ps-3 position-relative">
            <input type="text" class="form-control fw-bold grid-input barcode-input text-success" placeholder="請掃描或輸入..." autocomplete="off">
            <input type="hidden" name="product_id[]" class="pid-input">
        </td>
        <td><input type="text" class="form-control grid-readonly name-input" readonly tabindex="-1" placeholder="商品名稱"></td>
        <td><input type="number" name="qty[]" class="form-control text-center fw-bold grid-input qty-input" placeholder="數量"></td>
        <td><input type="number" name="price[]" class="form-control text-end fw-bold grid-input price-input" step="any" placeholder="進價"></td>
        <td><input type="text" name="remark[]" class="form-control grid-input remark-input" placeholder="備註"></td>
        <td class="text-center"><button type="button" class="btn btn-link text-danger p-0 del-btn" title="刪除此行 (F4)"><i class="fa-solid fa-xmark fs-4"></i></button></td>
    `;
    itemList.appendChild(tr);
    return tr;
}

window.onload = () => { createRow(); };

itemList.addEventListener('keydown', async function(e) {
    const tr = e.target.closest('tr');
    if (!tr) return;

    if (e.key === 'F4') {
        e.preventDefault();
        tr.remove();
        if (itemList.children.length === 0) {
            createRow().querySelector('.barcode-input').focus();
        } else {
            itemList.lastElementChild.querySelector('.barcode-input').focus();
        }
        return;
    }

    if (e.key === 'Enter') {
        e.preventDefault();
        if (e.target.classList.contains('barcode-input')) {
            const v = e.target.value.trim();
            if (!v) return;
            if (!hiddenVendorId.value) { alert('請先在最上方選擇「進貨廠商」！'); vendorSearch.focus(); return; }
            activeTr = tr; 
            searchProd(v, tr);
        }
        else if (e.target.classList.contains('qty-input')) {
            tr.querySelector('.price-input').focus();
            tr.querySelector('.price-input').select();
        }
        else if (e.target.classList.contains('price-input')) {
            tr.querySelector('.remark-input').focus();
        }
        else if (e.target.classList.contains('remark-input')) {
            if (tr.querySelector('.pid-input').value) {
                if (tr === itemList.lastElementChild) {
                    const newTr = createRow();
                    newTr.querySelector('.barcode-input').focus();
                } else {
                    tr.nextElementSibling.querySelector('.barcode-input').focus();
                }
            }
        }
    }
});

itemList.addEventListener('click', function(e) {
    if (e.target.closest('.del-btn')) {
        e.target.closest('tr').remove();
        if (itemList.children.length === 0) createRow().querySelector('.barcode-input').focus();
    }
});

document.getElementById('purchaseForm').addEventListener('submit', function() {
    itemList.querySelectorAll('tr').forEach(r => {
        if (!r.querySelector('.pid-input').value) { r.remove(); }
    });
});

function searchProd(v, tr){ 
    fetch(`/api/search_products?q=${v}`).then(r=>r.json()).then(d=>{ 
        if(d.length === 1) { populateProd(d[0], tr); } 
        else if(d.length > 1){ sList=d; showM(); } 
        else { alert('找不到商品！'); tr.querySelector('.barcode-input').value=''; }
    });
}
function showM(){ 
    resList.innerHTML = sList.map((p,i)=>`<tr class="search-row" onclick="selectProd(sList[${i}])"><td><b class="fs-5">${p.name}</b></td><td>${p.barcode||''}</td><td>${p.code1||''}</td></tr>`).join(''); 
    overlay.style.display='flex'; overlay.focus(); aIdx = 0; document.addEventListener('keydown', mK); updateA(); 
}
function mK(e){ 
    if(overlay.style.display !== 'flex') return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); aIdx = Math.min(aIdx+1, sList.length-1); updateA(); } 
    else if(e.key === 'ArrowUp'){ e.preventDefault(); aIdx = Math.max(aIdx-1, 0); updateA(); } 
    else if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); if(aIdx >= 0 && aIdx < sList.length) { selectProd(sList[aIdx]); } } 
    else if(e.key === 'Escape'){ hideM(); activeTr.querySelector('.barcode-input').focus(); }
}
function updateA(){ const rows = resList.querySelectorAll('.search-row'); rows.forEach((el, i) => { el.classList.remove('active'); if (i === aIdx) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); } }); }
function hideM(){ overlay.style.display='none'; document.removeEventListener('keydown', mK); }

function selectProd(p) { 
    if(!activeTr) return;
    hideM();
    populateProd(p, activeTr);
}

async function populateProd(p, tr) {
    tr.querySelector('.barcode-input').value = p.barcode || p.code1;
    tr.querySelector('.name-input').value = p.name;
    tr.querySelector('.pid-input').value = p.id;
    
    const qtyInput = tr.querySelector('.qty-input');
    if (!qtyInput.value) qtyInput.value = 1;
    
    const prInput = tr.querySelector('.price-input');
    const vid = document.getElementById('hiddenVendorId').value;
    
    try {
        const res = await fetch(`/api/get_latest_purchase_price?vendor_id=${vid}&product_id=${p.id}`);
        const data = await res.json();
        if (data && data.price !== null) { prInput.value = data.price; } else { prInput.value = p.cost || 0; }
    } catch(e) { prInput.value = p.cost || 0; }

    qtyInput.focus(); 
    qtyInput.select();
}
</script>
{% endblock %}
