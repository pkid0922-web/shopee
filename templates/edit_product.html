{% extends "layout.html" %}
{% block content %}
<div class="mb-4"><h3 class="fw-bold text-dark"><i class="fa-solid fa-pen-to-square me-2"></i>修改商品資料：{{ product.name }}</h3><a href="/products" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>返回清單</a></div>

<div class="card rounded-card border-0 shadow-sm p-4 bg-white">
    <form action="/edit_product/{{ product.id }}" method="POST" class="row g-4">
        <div class="col-md-6"><label class="small fw-bold">國際條碼</label><input type="text" name="barcode" class="form-control" value="{{ product.barcode or '' }}"></div>
        <div class="col-md-6"><label class="small fw-bold">商品名稱</label><input type="text" name="name" class="form-control" value="{{ product.name }}" required></div>

        <div class="col-md-3">
            <label class="small fw-bold text-success">商品販售狀態</label>
            <div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" name="is_active" id="activeSw" {% if product.is_active %}checked{% endif %}><label class="form-check-label fw-bold" for="activeSw">上架販售中</label></div>
        </div>

        <div class="col-md-3"><label class="small fw-bold">自編碼 1</label><input type="text" name="code1" class="form-control" value="{{ product.code1 or '' }}"></div>
        <div class="col-md-3"><label class="small fw-bold">自編碼 2</label><input type="text" name="code2" class="form-control" value="{{ product.code2 or '' }}"></div>

        <div class="col-md-3">
            <label class="small fw-bold text-info">主要供應商</label>
            <select name="vendor_id" class="form-select border-info">
                <option value="">(未指定)</option>
                {% for v in vendors %}
                <option value="{{ v.id }}" {% if product.vendor_id == v.id %}selected{% endif %}>{{ v.short_name or v.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3">
            <label class="small fw-bold">分類</label>
            <div class="input-group">
                <select name="category_id" class="form-select">{% for c in categories %}<option value="{{ c.id }}" {% if c.id == product.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select>
                <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#editCatModal">+</button>
            </div>
        </div>
        
        <div class="col-md-3">
            <label class="small fw-bold">單位</label>
            <div class="input-group">
                <select name="unit_id" class="form-select">{% for u in units %}<option value="{{ u.id }}" {% if u.id == product.unit_id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}</select>
                <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#editUnitModal">+</button>
            </div>
        </div>

        <div class="col-md-3"><label class="small fw-bold text-danger">採購成本</label><input type="number" name="cost" class="form-control border-danger" step="any" value="{{ product.cost }}"></div>
        <div class="col-md-3"><label class="small fw-bold text-primary">商品定價</label><input type="number" name="price" class="form-control border-primary" step="any" value="{{ product.price }}"></div>
        <div class="col-md-3"><label class="small fw-bold">安全庫存線</label><input type="number" name="safety_stock" class="form-control" value="{{ product.safety_stock }}"></div>
        <div class="col-md-3"><label class="small fw-bold">目前庫存量</label><input type="number" name="stock" class="form-control" value="{{ product.stock }}"></div>

        <div class="col-12 text-end mt-4"><button type="submit" class="btn btn-primary px-5 py-3 rounded-pill shadow-sm fw-bold">儲存並更新商品資料</button></div>
    </form>
</div>

<div class="modal fade" id="editCatModal" tabindex="-1"><div class="modal-dialog modal-sm modal-dialog-centered"><form action="/quick_add_cat" method="POST" class="modal-content border-0 shadow"><div class="modal-body p-4 text-center"><h6 class="fw-bold mb-3">新增分類</h6><input type="text" name="name" class="form-control mb-3" required><button type="submit" class="btn btn-primary w-100">確認</button></div></form></div></div>

<div class="modal fade" id="editUnitModal" tabindex="-1"><div class="modal-dialog modal-sm modal-dialog-centered"><form action="/quick_add_unit" method="POST" class="modal-content border-0 shadow"><div class="modal-body p-4 text-center"><h6 class="fw-bold mb-3">新增單位</h6><input type="text" name="name" class="form-control mb-3" required><button type="submit" class="btn btn-primary w-100">確認</button></div></form></div></div>
{% endblock %}
