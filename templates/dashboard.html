{% extends "layout.html" %}
{% block title %}總覽 - 雲端進銷存系統{% endblock %}
{% block content %}
<h2>總覽</h2>
<div class="card">
  <p>商品數：{{ stats.product_count }}</p>
  <p>客戶數：{{ stats.customer_count }}</p>
  <p>供應商數：{{ stats.vendor_count }}</p>
  <p>銷貨單數：{{ stats.sales_order_count }}</p>
</div>
<p style="color:#9ca3af; margin-top:16px;">這是骨架階段的最小總覽頁，之後會補上庫存警示、待出貨蝦皮訂單等內容。</p>
{% endblock %}
