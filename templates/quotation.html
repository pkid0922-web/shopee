{% extends "layout.html" %}
{% block content %}

<style>
    .search-results { position: absolute; z-index: 1050; width: 100%; top: 100%; left: 0; background: white; border: 1px solid #0d6efd; border-radius: 0 0 10px 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: none; max-height: 250px; overflow-y: auto; }
    .search-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f8f9fa; transition: 0.2s; }
    .search-item:hover { background: #f0f8ff; }
    .search-item.active { background: #0d6efd; color: white; }
    
    .grid-input { border: 2px solid transparent; background-color: transparent; transition: 0.2s; font-size: 1.1rem; }
    .grid-input:focus { border: 2px solid #0d6efd; background-color: #fff; outline: none; box-shadow: 0 0 8px rgba(13,110,253,0.3); }
    .grid-readonly { background-color: #f8f9fa !important; color: #6c757d; border: 1px solid #dee2e6; }
    
    #searchOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; }
    .search-modal { background: white; width: 85%; max-width: 900px; max-height: 80vh; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    .search-body { flex: 1; overflow-y: auto; padding: 10px; }
    .search-row { cursor: pointer; border-bottom: 1px solid #eee; }
    .search-row.active td { background-color: #0d6efd !important; color: white !important; }
</style>

<div class="mb-4">
    <h3 class="fw-bold text-primary m-0"><i class="fa-solid fa-file-invoice-dollar me-2"></i>報價單終極工作站</h3>
    <p class="text-muted small mt-1 mb-0">您可以透過日期範圍自動載入新品，也可以在下方表格手動搜尋並加入任何商品。</p>
</div>

<div class="card rounded-card border-0 shadow-sm p-4 mb-4 bg-white border-start border-5 border-info">
    <form action="/quotation" method="GET" class="row g-3 align-items-end" id="filterForm">
        <div class="col-md-4 position-relative">
            <label class="small fw-bold text-primary mb-1">1. 報價對象 (搜尋編號/簡稱) <span class="text-danger">*</span></label>
            <input type="text" id="custSearch" class="form-control form-control-lg bg-light" placeholder="🔍 搜尋客戶..." value="{{ selected_cust.cust_no ~ ' - ' ~ selected_cust.short_name if selected_cust else '' }}" autocomplete="off" required>
            <input type="hidden" name="customer_id" id="hiddenCustId" value="{{ selected_cust.id if selected_cust else '' }}">
            <div id="custDropdown" class="search-results text-dark"></div>
        </div>
        <div class="col-md-3">
            <label class="small fw-bold mb-1">2. [選用] 新品上架 (起)</label>
            <input type="date" name="start_date" class="form-control form-control-lg bg-light" value="{{ start_date }}">
        </div>
        <div class="col-md-3">
            <label class="small fw-bold mb-1">3. [選用] 新品上架 (迄)</label>
            <input type="date" name="end_date" class="form-control form-control-lg bg-light" value="{{ end_date }}">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-info text-white btn-lg w-100 fw-bold rounded-pill shadow-sm" onclick="return checkCustomer()"><i class="fa-solid fa-bolt me-2"></i>自動載入</button>
        </div>
    </form>
</div>

<form action="/preview_quotation" method="POST" id="quoteForm">
    <input type="hidden" name="customer_id" id="printCustId" value="{{ selected_cust.id if selected_cust else '' }}">
    
    <div class="card rounded-card border-0 shadow-sm bg-white overflow-hidden mb-4">
        <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
            <div class="fw-bold text-dark fs-5">
                <i class="fa-solid fa-list-check me-2 text-primary"></i>報價清單編輯區
            </div>
            <div class="text-muted small">
                <i class="fa-solid fa-circle-info me-1"></i>在最後一行按 Enter 可繼續手動搜尋新增商品
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 text-center">
                <thead class="small" style="background-color: #343a40; color: white;">
                    <tr>
                        <th width="20%" class="ps-3 py-3 text-start">國際條碼 (掃碼/搜檔)</th>
                        <th width="35%" class="py-3 text-start">商品名稱</th>
                        <th width="15%" class="py-3">標準定價</th>
                        <th width="20%" class="py-3 text-warning">給客人的報價單價</th>
                        <th width="10%" class="pe-3 py-3">移除</th>
                    </tr>
                </thead>
                <tbody id="itemList">
                    </tbody>
            </table>
        </div>
    </div>
    
    <div class="text-end mt-4 mb-5 pb-5">
        <button type="button" class="btn btn-primary btn-lg px-5 rounded-pill fw-bold shadow fs-4" onclick="submitQuote()">
            <i class="fa-solid fa-print me-2"></i>產生正式報價單
        </button>
    </div>
</form>

<div id="searchOverlay" tabindex="-1">
    <div class="search-modal">
        <div class="search-body">
            <table class="table align-middle"><thead class="sticky-top bg-white"><tr class="text-muted small"><th>商品名稱</th><th>國際條碼</th><th>定價</th></tr></thead><tbody id="resList"></tbody></table>
        </div>
    </div>
</div>

<script>
// === 客戶搜尋邏輯 ===
const custData = [ {% for c in customers %} { id: "{{ c.id }}", no: "{{ c.cust_no }}", name: "{{ c.short_name }}" }, {% endfor %} ];
const custSearch = document.getElementById('custSearch'), custDropdown = document.getElementById('custDropdown');
const hiddenCustId = document.getElementById('hiddenCustId');
const printCustId = document.getElementById('printCustId');
let filteredCusts = [], custActiveIdx = -1;

custSearch.addEventListener('input', function() {
    const q = this.value.toLowerCase().trim(); 
    hiddenCustId.value = ''; printCustId.value = '';
    if (!q) { filteredCusts = custData; } else { filteredCusts = custData.filter(c => c.no.toLowerCase().includes(q) || c.name.toLowerCase().includes(q)); }
    showCustDropdown();
});
function showCustDropdown() {
    if (filteredCusts.length === 0) { custDropdown.innerHTML = '<div class="p-3 text-muted text-center">找不到相符客戶</div>'; } 
    else { custDropdown.innerHTML = filteredCusts.map((c, i) => `<div class="search-item" onclick="selectCust(${i})" id="cust-row-${i}"><span class="fw-bold">${c.no}</span> - <span>${c.name}</span></div>`).join(''); }
    custDropdown.style.display = 'block'; custActiveIdx = -1;
}
function selectCust(idx) {
    const c = filteredCusts[idx]; 
    custSearch.value = `${c.no} - ${c.name}`; 
    hiddenCustId.value = c.id; 
    printCustId.value = c.id; // 同步給列印表單
    custDropdown.style.display = 'none'; 
}
// 防呆：確保撈資料前有選客戶
function checkCustomer() {
    if(!hiddenCustId.value) { alert('請先從下拉選單中選擇正確的客戶！'); custSearch.focus(); return false; }
    return true;
}

// === 連續網格快打邏輯 ===
const itemList = document.getElementById('itemList');
let activeTr = null, sList = [], aIdx = -1;
const overlay = document.getElementById('searchOverlay'), resList = document.getElementById('resList');

// 💡 接收後端傳來的「日期撈取新品清單」
const fetchedProducts = [
    {% for p in products %}
    { id: "{{ p.id }}", barcode: "{{ p.barcode or p.code1 or '' }}", name: "{{ p.name }}", price: {{ p.price }} },
    {% endfor %}
];

// 初始化畫面
window.onload = () => { 
    // 1. 如果有日期撈取出來的商品，自動轉化成網格
    fetchedProducts.forEach(p => {
        const tr = createRow();
        populateProd(p, tr);
    });
    // 2. 無論如何，最下面永遠留一行空白的給業務「智慧搜尋」手動加商品
    createRow(); 
};

function createRow() {
    const tr = document.createElement('tr');
    tr.className = 'product-row';
    tr.innerHTML = `
        <td class="ps-3 position-relative text-start">
            <input type="text" class="form-control fw-bold grid-input barcode-input text-primary" placeholder="輸入條碼或關鍵字..." autocomplete="off">
            <input type="hidden" name="product_id[]" class="pid-input">
        </td>
        <td class="text-start"><input type="text" class="form-control grid-readonly name-input" readonly tabindex="-1" placeholder="商品名稱"></td>
        <td><input type="number" class="form-control text-center grid-readonly std-price-input" readonly tabindex="-1" placeholder="$0"></td>
        <td><input type="number" name="quote_price[]" class="form-control text-center fw-bold grid-input quote-price-input text-danger bg-warning-subtle" placeholder="自訂報價"></td>
        <td class="pe-3"><button type="button" class="btn btn-link text-danger p-0 del-btn" title="刪除此行 (F4)"><i class="fa-solid fa-trash-can fs-5"></i></button></td>
    `;
    itemList.appendChild(tr);
    return tr;
}

itemList.addEventListener('keydown', async function(e) {
    const tr = e.target.closest('tr');
    if (!tr) return;

    // F4 快速刪除
    if (e.key === 'F4') {
        e.preventDefault(); tr.remove();
        if (itemList.children.length === 0) createRow().querySelector('.barcode-input').focus();
        return;
    }

    if (e.key === 'Enter') {
        e.preventDefault();

        // 1. 搜尋框按 Enter
        if (e.target.classList.contains('barcode-input')) {
            const v = e.target.value.trim();
            if (!v) return;
            activeTr = tr; 
            searchProd(v, tr);
        }
        // 2. 報價框按 Enter -> 自動跳下一行
        else if (e.target.classList.contains('quote-price-input')) {
            if (tr.querySelector('.pid-input').value) {
                if (tr === itemList.lastElementChild) {
                    createRow().querySelector('.barcode-input').focus();
                } else {
                    tr.nextElementSibling.querySelector('.barcode-input').focus();
                }
            }
        }
    }
});

// 刪除按鈕
itemList.addEventListener('click', function(e) {
    if (e.target.closest('.del-btn')) {
        e.target.closest('tr').remove();
        if (itemList.children.length === 0) createRow().querySelector('.barcode-input').focus();
    }
});

// 呼叫 API 搜尋商品
function searchProd(v, tr){ 
    fetch(`/api/search_products?q=${v}`).then(r=>r.json()).then(d=>{ 
        if(d.length === 1) { populateProd(d[0], tr); } 
        else if(d.length > 1){ sList=d; showM(); } 
        else { alert('找不到商品！'); tr.querySelector('.barcode-input').value=''; }
    });
}

// 模糊搜尋 Modal 控制
function showM(){ 
    resList.innerHTML = sList.map((p,i)=>`<tr class="search-row" onclick="selectProd(sList[${i}])"><td><b class="fs-5">${p.name}</b></td><td>${p.barcode||''}</td><td class="text-danger fw-bold">$${p.price}</td></tr>`).join(''); 
    overlay.style.display='flex'; overlay.focus(); aIdx = 0; document.addEventListener('keydown', mK); updateA(); 
}
function mK(e){ 
    if(overlay.style.display !== 'flex') return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); aIdx = Math.min(aIdx+1, sList.length-1); updateA(); } 
    else if(e.key === 'ArrowUp'){ e.preventDefault(); aIdx = Math.max(aIdx-1, 0); updateA(); } 
    else if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); if(aIdx >= 0 && aIdx < sList.length) { selectProd(sList[aIdx]); } } 
    else if(e.key === 'Escape'){ hideM(); activeTr.querySelector('.barcode-input').focus(); }
}
function updateA(){ const rows = resList.querySelectorAll('.search-row'); rows.forEach((el, i) => { el.classList.remove('active'); if (i === aIdx) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); } }); }
function hideM(){ overlay.style.display='none'; document.removeEventListener('keydown', mK); }
function selectProd(p) { if(!activeTr) return; hideM(); populateProd(p, activeTr); }

// 把商品資料填入網格
function populateProd(p, tr) {
    tr.querySelector('.barcode-input').value = p.barcode || p.code1 || '無';
    tr.querySelector('.name-input').value = p.name;
    tr.querySelector('.pid-input').value = p.id;
    tr.querySelector('.std-price-input').value = p.price;
    
    // 預設報價等於標準定價
    const qPriceInput = tr.querySelector('.quote-price-input');
    if (!qPriceInput.value) qPriceInput.value = p.price;

    qPriceInput.focus(); 
    qPriceInput.select();
}

// 送出報價單防呆
function submitQuote() {
    if(!printCustId.value) { alert('請先在上方選擇「報價對象」！'); window.scrollTo(0,0); custSearch.focus(); return; }
    
    // 拔掉沒有填商品的空行
    itemList.querySelectorAll('tr').forEach(r => {
        if (!r.querySelector('.pid-input').value) { r.remove(); }
    });
    
    if(itemList.children.length === 0) {
        alert('報價清單內沒有任何商品喔！請先載入或手動加入商品。');
        createRow().querySelector('.barcode-input').focus();
        return;
    }
    
    // 開發者預告：防呆通過，把表單 POST 到下一頁的列印畫面
    alert("老闆，資料已經準備好要拋轉了！請回覆我『下一頁』，我們來做正式列印版面！");
    // 等下一頁的路由寫好，我們就把這行改成 document.getElementById('quoteForm').submit();
}
</script>
{% endblock %}
